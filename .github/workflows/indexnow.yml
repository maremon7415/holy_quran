name: IndexNow

# Pings IndexNow (Bing → ChatGPT search & Copilot, Yandex, Seznam …) with every sitemap URL.
# Needs repository secrets INDEXNOW_KEY and SITE_URL (and INDEXNOW_KEY set on the deployment so
# /{key}.txt is served). Skips gracefully when they are not configured.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List URLs only, do not submit'
        type: boolean
        default: false
  push:
    branches: [master]
  # Vercel (and other hosts) report deployments back to GitHub; run as soon as production is live.
  deployment_status:

permissions:
  contents: read

jobs:
  submit:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && contains(fromJSON('["Production","production"]'), github.event.deployment.environment))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # job-level so skipped (preview) deployment events never cancel a running submission;
    # a production deployment_status supersedes the push run that is still waiting for the deploy
    concurrency:
      group: indexnow
      cancel-in-progress: true
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$INDEXNOW_KEY" ] || [ -z "$SITE_URL" ]; then
            echo "::notice::IndexNow skipped: set the INDEXNOW_KEY and SITE_URL repository secrets to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: 22
      # On a plain push, give the deployment time to go live; wait until the new key file answers.
      - name: Wait for deployment
        if: steps.cfg.outputs.enabled == 'true' && github.event_name == 'push'
        run: |
          sleep 180
          for i in $(seq 1 30); do
            if [ "$(curl -fsS "$SITE_URL/$INDEXNOW_KEY.txt" || true)" = "$INDEXNOW_KEY" ]; then exit 0; fi
            sleep 20
          done
          echo "::warning::$SITE_URL/$INDEXNOW_KEY.txt does not serve the key; continuing (the script will fail clearly)."
      - name: Submit sitemap URLs
        if: steps.cfg.outputs.enabled == 'true'
        run: node scripts/indexnow.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
